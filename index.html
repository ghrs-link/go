<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Global HR Strategy</title>
<style>
  body { font-family: sans-serif; text-align: center; padding: 48px 16px; color: #0F2932; }
  a { color: #0F2932; }
</style>
</head>
<body>
<p>ページを開いています…</p>
<p><a id="go" href="https://note.com/ghrs">開かない場合はこちら</a></p>
<script>
(function () {
  // 経路名（src）→ 行き先URL。経路を増やすときは、ここに1行足す
  var ROUTES = {
    "yt_note": "https://note.com/ghrs",                 // YouTube（概要欄）→ note
    "yt_line": "https://line.me/ti/p/%40150xujnk",      // YouTube（概要欄）→ LINE（Lステップ）
    "seminar_note": "https://note.com/ghrs",            // セミナー資料のQR → note
    "event_note": "https://note.com/ghrs"               // イベント（EXPOなど）のQR → note
  };
  // 一覧にない経路名のときの行き先
  var DEFAULT_URL = "https://note.com/ghrs";
  // 記録先（Apps Script「経路計測_中継URL（試作）」）
  var LOG_URL = "https://script.google.com/macros/s/AKfycbzC7PTEzCeFjKVqqSs8aCh_MZnA6Kk8u_GFrHyKnNdBBMCCk8B6LDmtqmEj8rqeCwhtPQ/exec";

  var src = (new URLSearchParams(location.search).get("src") || "(なし)").slice(0, 50);
  var to = Object.prototype.hasOwnProperty.call(ROUTES, src) ? ROUTES[src] : DEFAULT_URL;
  document.getElementById("go").href = to;

  // 記録するのは日時（Apps Script側で付与）・経路名・行き先だけ
  var url = LOG_URL + "?src=" + encodeURIComponent(src) + "&to=" + encodeURIComponent(to);
  var sent = false;
  try { sent = navigator.sendBeacon(url); } catch (e) {}
  if (!sent) {
    try { fetch(url, { method: "POST", mode: "no-cors", keepalive: true }); } catch (e) {}
  }
  setTimeout(function () { location.replace(to); }, 300);
})();
</script>
</body>
</html>
